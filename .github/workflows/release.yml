name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-apks:
    uses: ./.github/workflows/build-apks.yml
    secrets: inherit
  release:
    runs-on: ubuntu-latest
    needs:
      - build-apks
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: release
        uses: softprops/action-gh-release@v3
        with:
            files: |
              debug/*.apk
              release/*.apk
              mappings/mapping.txt
            fail_on_unmatched_files: true
